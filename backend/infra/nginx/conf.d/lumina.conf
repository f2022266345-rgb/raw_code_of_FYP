# LUMINA nginx — reverse proxy for the Express gateway.
# Replace `api.example.com` with your real API subdomain everywhere below.
#
# FLOW:
#   1) Deploy with ONLY the HTTP server block (TLS block commented out).
#   2) Run certbot (see VM_deploy.md) to obtain the certificate.
#   3) Uncomment the HTTPS server + the redirect line, then reload nginx.
#
# The FastAPI service is intentionally NOT exposed here — it is reachable only
# inside lumina-net by the Express container (http://lumina-backend:8000).

server {
    listen 80;
    server_name api.example.com;

    # ACME HTTP-01 challenge for Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Before SSL: proxy straight through. ──
    # After you enable the HTTPS block below, REPLACE the proxy block with:
    #   return 301 https://$host$request_uri;
    location / {
        proxy_pass         http://lumina-express:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

